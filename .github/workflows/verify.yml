name: Verify research site

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Test verifier with synthetic fixtures
        run: python -m unittest discover -s scripts/tests -v
      - name: Audit integrated data, source links, rendering mapping, and publication structure
        run: python scripts/verify.py --root . --base-path /RentincreaseSF5 --external --strict-warnings --json verification-report.json
      - name: Upload non-sensitive audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-report
          path: verification-report.json
          if-no-files-found: warn
